<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <!-- Canvas Confetti Library for Pure Red Paper Burst -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Entirely Romantic Soft Pink & Warm Sunset Gradient */
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            color: #4a148c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #d81b60, #e91e63);
            color: #ffffff;
            border: none;
            padding: 20px 42px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.35);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.5);
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 45px;
            color: #d81b60;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(216, 27, 96, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e91e63, #ff4081, #ffeb3b);
            border-radius: 10px;
            transition: width 0.05s linear;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        /* Elegant Soft Glassmorphic Card */
        .card-tilt {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 50px rgba(216, 27, 96, 0.15);
            position: relative;
            overflow: hidden;
            animation: tilt3D 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes tilt3D {
            0% {
                transform: rotateY(-25deg) rotateX(12deg) scale(0.85);
            }
            50% {
                transform: rotateY(12deg) rotateX(-8deg) scale(1.03);
            }
            100% {
                transform: rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        /* Diagonal Sweeping Glow Effect */
        .card-tilt::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                135deg,
                transparent 42%,
                rgba(255, 255, 255, 0.9) 48%,
                rgba(255, 64, 129, 0.6) 50%,
                rgba(255, 215, 0, 0.6) 52%,
                transparent 58%
            );
            pointer-events: none;
            animation: diagonalGlowSweep 2s ease-in-out 0.3s forwards;
        }

        @keyframes diagonalGlowSweep {
            0% {
                transform: translate(-50%, -50%);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translate(50%, 50%);
                opacity: 0;
            }
        }

        .card-header {
            color: #da251d;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #880e4f;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
            font-weight: 500;
        }

        .action-area {
            text-align: center;
        }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(0, 104, 255, 0.3);
            transition: transform 0.2s;
        }

        .zalo-btn:hover {
            transform: translateY(-2px);
        }

        /* SVG Code-Based Flower Petals (No Emoji) */
        .svg-petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: diagonalRain linear forwards;
        }

        @keyframes diagonalRain {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translate(300px, 115vh) rotate(420deg);
            }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- 1. Open Button -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">
            Open Phyy Letter 💌
        </button>
    </div>

    <!-- 2. Loading Bar -->
    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #ad1457; font-weight: 600;">Opening your private letter...</div>
    </div>

    <!-- 3. Final Interface -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">
                A NEW CHAPTER 🇻🇳 ❤️
            </div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('open-btn').addEventListener('click', function(e) {
            // First Code Red Paper Confetti Explosion
            confetti({
                particleCount: 70,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#da251d', '#ff1744', '#ffc107', '#d81b60']
            });

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';

            let progress = 0;
            const progressBar = document.getElementById('p-bar');
            const interval = setInterval(() => {
                progress += 2;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showMainInterface, 300);
                }
            }, 30);
        });

        function showMainInterface() {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'block';

            // SVG Code-Based Petals Shower
            setTimeout(createDiagonalFlowerShower, 300);

            // Message Typewriter
            typeWriterMessage();
        }

        // Code-Drawn SVG Petal Generator
        function createDiagonalFlowerShower() {
            const count = 40;
            const petalColors = ['#ff80ab', '#f48fb1', '#ff4081', '#f06292'];

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'svg-petal';

                    const size = Math.random() * 14 + 16;
                    const color = petalColors[Math.floor(Math.random() * petalColors.length)];

                    // SVG Vector Flower Petal Shape
                    petal.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
                            <path d="M12 2C9 7 4 9 4 14c0 4.4 3.6 8 8 8s8-3.6 8-8c0-5-5-7-8-12z" opacity="0.85"/>
                        </svg>
                    `;

                    petal.style.left = (Math.random() * 120 - 20) + 'vw';
                    petal.style.top = '-10vh';
                    petal.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';

                    document.body.appendChild(petal);

                    setTimeout(() => petal.remove(), 4500);
                }, i * 85);
            }
        }

        function typeWriterMessage() {
            const text = "I have shut down my main accounts and cut out every unnecessary distraction.\n\nYour dedication, loyalty, and actions showed me what really matters. My energy and focus belong completely to our future now.\n\nNo distractions. Just us.";
            let index = 0;
            const target = document.getElementById('typed-text');

            function type() {
                if (index < text.length) {
                    target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                    index++;
                    setTimeout(type, 35);
                }
            }
            type();
        }
    </script>
</body>
</html>
