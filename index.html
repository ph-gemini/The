<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <!-- Canvas Confetti Library for Pure Red Paper Burst -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Rich Romantic Depth Background */
            background: radial-gradient(circle at 50% 30%, #4a1228 0%, #290a17 60%, #15030b 100%);
            color: #fff0f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
            position: relative;
        }

        /* 1. Screen Outer Edge Glow (ဖုန်း/စခရင် ဘောင် အနားလင်းလက်မှု) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255, 105, 180, 0.4);
            box-shadow: inset 0 0 35px rgba(255, 64, 129, 0.6),
                        inset 0 0 70px rgba(216, 27, 96, 0.4);
            pointer-events: none;
            z-index: 20;
            animation: screenGlowPulse 3s infinite alternate ease-in-out;
        }

        @keyframes screenGlowPulse {
            0% {
                box-shadow: inset 0 0 25px rgba(255, 64, 129, 0.4),
                            inset 0 0 50px rgba(216, 27, 96, 0.2);
                border-color: rgba(255, 105, 180, 0.3);
            }
            100% {
                box-shadow: inset 0 0 45px rgba(255, 64, 129, 0.8),
                            inset 0 0 90px rgba(255, 182, 193, 0.5);
                border-color: rgba(255, 182, 193, 0.8);
            }
        }

        /* Ambient Background Floating Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #ff4081;
            top: 10%;
            left: 15%;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #880e4f;
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.15); }
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: #ffffff;
            border: none;
            padding: 20px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.6),
                        0 0 50px rgba(216, 27, 96, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 64, 129, 0.9),
                        0 0 70px rgba(255, 182, 193, 0.7);
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 48px;
            color: #ff4081;
            text-shadow: 0 0 20px #ff4081;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #ff80ab, #ffeb3b);
            border-radius: 10px;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px #ff4081;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        /* 2. Textbox Edge Neon Glow (Letter Box ဘောင် လင်းလက်မှု) */
        .card-tilt {
            background: rgba(35, 12, 22, 0.75);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1.5px solid rgba(255, 128, 171, 0.5);
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.35),
                        0 0 60px rgba(216, 27, 96, 0.25),
                        inset 0 0 20px rgba(255, 105, 180, 0.15);
            position: relative;
            overflow: hidden;
            animation: tilt3D 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       boxGlowPulse 3s infinite alternate ease-in-out 2.2s;
        }

        @keyframes boxGlowPulse {
            0% {
                border-color: rgba(255, 128, 171, 0.4);
                box-shadow: 0 0 25px rgba(255, 64, 129, 0.3),
                            0 0 50px rgba(216, 27, 96, 0.2);
            }
            100% {
                border-color: rgba(255, 182, 193, 0.9);
                box-shadow: 0 0 40px rgba(255, 64, 129, 0.6),
                            0 0 80px rgba(255, 105, 180, 0.4),
                            inset 0 0 25px rgba(255, 105, 180, 0.3);
            }
        }

        @keyframes tilt3D {
            0% {
                transform: rotateY(-25deg) rotateX(12deg) scale(0.85);
            }
            50% {
                transform: rotateY(12deg) rotateX(-8deg) scale(1.03);
            }
            100% {
                transform: rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        /* Diagonal Sweeping Glow Effect */
        .card-tilt::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                135deg,
                transparent 42%,
                rgba(255, 255, 255, 0.9) 48%,
                rgba(255, 64, 129, 0.8) 50%,
                rgba(255, 215, 0, 0.7) 52%,
                transparent 58%
            );
            pointer-events: none;
            animation: diagonalGlowSweep 2s ease-in-out 0.3s forwards;
        }

        @keyframes diagonalGlowSweep {
            0% {
                transform: translate(-50%, -50%);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translate(50%, 50%);
                opacity: 0;
            }
        }

        .card-header {
            color: #ff80ab;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
            text-shadow: 0 0 12px rgba(255, 128, 171, 0.6);
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #fff0f5;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .action-area {
            text-align: center;
        }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 104, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .zalo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 104, 255, 0.8);
        }

        /* SVG Code-Based Flower Petals */
        .svg-petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: diagonalRain linear forwards;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.6));
        }

        @keyframes diagonalRain {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
                transform: translate(320px, 115vh) rotate(420deg);
            }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Background Glowing Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- 1. Open Button -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">
            Open Phyy Letter 💌
        </button>
    </div>

    <!-- 2. Loading Bar -->
    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #ff80ab; font-weight: 600;">Opening your private letter...</div>
    </div>

    <!-- 3. Final Interface -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">
                A NEW CHAPTER 🇻🇳 ❤️
            </div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('open-btn').addEventListener('click', function(e) {
            // First Code Red Paper Confetti Explosion
            confetti({
                particleCount: 80,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#da251d', '#ff1744', '#ffc107', '#ff4081']
            });

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';

            let progress = 0;
            const progressBar = document.getElementById('p-bar');
            const interval = setInterval(() => {
                progress += 2;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showMainInterface, 300);
                }
            }, 30);
        });

        function showMainInterface() {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'block';

            // SVG Petals Shower
            setTimeout(createDiagonalFlowerShower, 300);

            // Message Typewriter
            typeWriterMessage();
        }

        // Code-Drawn SVG Petal Generator with Glowing Effect
        function createDiagonalFlowerShower() {
            const count = 45;
            const petalColors = ['#ff80ab', '#ff4081', '#f48fb1', '#ff1744'];

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'svg-petal';

                    const size = Math.random() * 14 + 16;
                    const color = petalColors[Math.floor(Math.random() * petalColors.length)];

                    petal.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
                            <path d="M12 2C9 7 4 9 4 14c0 4.4 3.6 8 8 8s8-3.6 8-8c0-5-5-7-8-12z"/>
                        </svg>
                    `;

                    petal.style.left = (Math.random() * 120 - 20) + 'vw';
                    petal.style.top = '-10vh';
                    petal.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';

                    document.body.appendChild(petal);

                    setTimeout(() => petal.remove(), 4500);
                }, i * 80);
            }
        }

        function typeWriterMessage() {
            const text = "I have shut down my main accounts and cut out every unnecessary distraction.\n\nYour dedication, loyalty, and actions showed me what really matters. My energy and focus belong completely to our future now.\n\nNo distractions. Just us.";
            let index = 0;
            const target = document.getElementById('typed-text');

            function type() {
                if (index < text.length) {
                    target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                    index++;
                    setTimeout(type, 35);
                }
            }
            type();
        }
    </script>
</body>
</html>
