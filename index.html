<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #ffebee;
        }

        /* ----- Background Canvas ----- */
        #art-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ----- Outer Glow Frame ----- */
        .screen-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255, 128, 171, 0.8);
            box-shadow: inset 0 0 30px #ff80ab, inset 0 0 60px rgba(255, 64, 129, 0.3);
            pointer-events: none;
            z-index: 20;
            animation: singlePinkBreathe 2.5s infinite alternate ease-in-out;
        }

        @keyframes singlePinkBreathe {
            0% {
                border-color: rgba(255, 128, 171, 0.5);
                box-shadow: inset 0 0 20px #ff80ab, inset 0 0 40px rgba(255, 64, 129, 0.2);
            }
            100% {
                border-color: rgba(255, 128, 171, 1);
                box-shadow: inset 0 0 40px #ff80ab, inset 0 0 80px rgba(255, 64, 129, 0.5);
            }
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            color: #ffffff;
            border: none;
            padding: 20px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px #ff80ab;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 45px #ff4081;
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 48px;
            color: #ff4081;
            text-shadow: 0 0 20px #ff80ab;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff80ab;
            box-shadow: 0 0 15px #ff80ab;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4081;
            border-radius: 10px;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px #ff4081;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        .card-tilt {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #ff80ab;
            box-shadow: 0 0 35px #ff80ab, 0 0 70px rgba(255, 64, 129, 0.3);
            position: relative;
        }

        .card-header {
            color: #da251d;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #4a148c;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
            font-weight: 600;
        }

        .action-area { text-align: center; }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 104, 255, 0.5);
            transition: transform 0.2s;
        }

        .zalo-btn:hover { transform: translateY(-2px); }

        .svg-petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: verticalRain linear forwards;
        }

        @keyframes verticalRain {
            0% { opacity: 0; transform: translateY(0) rotate(0deg); }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; }
            100% { opacity: 0; transform: translateY(115vh) rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Canvas Engine for Background Art -->
    <canvas id="art-canvas"></canvas>

    <!-- Outer Screen Frame Glow -->
    <div class="screen-glow"></div>

    <!-- Step 1 -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">Open Phyy Letter 💌</button>
    </div>

    <!-- Step 2 -->
    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #880e4f; font-weight: 700;">Opening your private letter...</div>
    </div>

    <!-- Step 3 (Corrected HTML Structure) -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">A NEW CHAPTER 🇻🇳 ❤️</div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn" target="_blank">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('art-canvas');
            const ctx = canvas.getContext('2d');

            let grassBlades = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                generateGrass();
            }

            function generateGrass() {
                grassBlades = [];
                const count = Math.floor(canvas.width * 1.2);
                const startY = canvas.height * 0.65;

                for (let i = 0; i < count; i++) {
                    grassBlades.push({
                        x: Math.random() * canvas.width,
                        y: startY + Math.random() * (canvas.height - startY),
                        height: Math.random() * 22 + 12,
                        curve: (Math.random() - 0.5) * 15,
                        color: Math.random() < 0.5 ? '#7ec850' : '#5ba829',
                        windOffset: Math.random() * Math.PI * 2
                    });
                }
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const butterfly = {
                x: window.innerWidth * 0.5,
                y: window.innerHeight * 0.7,
                targetX: window.innerWidth * 0.5,
                targetY: window.innerHeight * 0.7,
                angle: 0
            };

            const catBlack = {
                x: window.innerWidth * 0.3,
                y: window.innerHeight * 0.8,
                color: '#1a1a1a',
                eyeColor: '#ffeb3b'
            };

            const catGolden = {
                x: window.innerWidth * 0.4,
                y: window.innerHeight * 0.83,
                color: '#d48817',
                eyeColor: '#4caf50'
            };

            function drawCat(c, time, isGolden) {
                ctx.save();
                ctx.translate(c.x, c.y + Math.sin(time * 3) * 3);

                // Tail
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-12, -4);
                ctx.quadraticCurveTo(-26, -22 + Math.sin(time * 4) * 8, -18, -32);
                ctx.stroke();

                // Body
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.arc(12, -12, 11, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(5, -18); ctx.lineTo(9, -27); ctx.lineTo(14, -20);
                ctx.moveTo(13, -20); ctx.lineTo(18, -27); ctx.lineTo(21, -16);
                ctx.fill();

                // Eye
                ctx.fillStyle = c.eyeColor;
                ctx.beginPath();
                ctx.arc(17, -13, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.0025;

                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
                skyGrad.addColorStop(0, '#ff9a9e');
                skyGrad.addColorStop(1, '#c2e9fb');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Ground
                const groundY = canvas.height * 0.65;
                ctx.fillStyle = '#5ba829';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                // Grass
                ctx.lineWidth = 1.8;
                for (let i = 0; i < grassBlades.length; i++) {
                    const b = grassBlades[i];
                    const sway = Math.sin(time * 2 + b.windOffset) * 4;
                    ctx.strokeStyle = b.color;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.quadraticCurveTo(b.x + b.curve, b.y - b.height * 0.5, b.x + b.curve + sway, b.y - b.height);
                    ctx.stroke();
                }

                // Butterfly Logic
                butterfly.angle += 0.1;
                if (Math.random() < 0.02) {
                    butterfly.targetX = Math.random() * (canvas.width * 0.6) + canvas.width * 0.2;
                    butterfly.targetY = canvas.height * 0.65 + Math.random() * (canvas.height * 0.2);
                }
                butterfly.x += (butterfly.targetX - butterfly.x) * 0.03;
                butterfly.y += (butterfly.targetY - butterfly.y) * 0.03 + Math.sin(butterfly.angle) * 2;

                ctx.fillStyle = '#e91e63';
                ctx.beginPath();
                ctx.arc(butterfly.x, butterfly.y, 5, 0, Math.PI * 2);
                ctx.fill();

                // Cats Movement
                catBlack.x += (butterfly.x - 40 - catBlack.x) * 0.02;
                catGolden.x += (butterfly.x + 30 - catGolden.x) * 0.02;

                drawCat(catBlack, time, false);
                drawCat(catGolden, time, true);

                requestAnimationFrame(render);
            }

            render();

            /* Button Event Handlers */
            document.getElementById('open-btn').addEventListener('click', () => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
                }

                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'flex';

                let progress = 0;
                const progressBar = document.getElementById('p-bar');
                const interval = setInterval(() => {
                    progress += 4;
                    progressBar.style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                        document.getElementById('step-2').style.display = 'none';
                        document.getElementById('step-3').style.display = 'block';
                        typeWriterMessage();
                    }
                }, 30);
            });

            function typeWriterMessage() {
                const text = "I have shut down my main accounts and cut out every unnecessary distraction.\n\nYour dedication, loyalty, and actions showed me what really matters. My energy and focus belong completely to our future now.\n\nNo distractions. Just us.";
                let index = 0;
                const target = document.getElementById('typed-text');
                target.innerHTML = "";

                function type() {
                    if (index < text.length) {
                        target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                        index++;
                        setTimeout(type, 35);
                    }
                }
                type();
            }
        });
    </script>
</body>
</html>
