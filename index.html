<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #eef2f5; }
        #art-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #step-1 { text-align: center; z-index: 10; }
        .letter-btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; border: none; padding: 22px 50px; font-size: 22px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 15px 35px rgba(255, 71, 87, 0.35); transition: all 0.3s; }
        .letter-btn:hover { transform: translateY(-3px) scale(1.05); }
        #step-2 { display: none; flex-direction: column; align-items: center; gap: 16px; z-index: 10; }
        .heart-icon { font-size: 52px; color: #ff4757; animation: heartPulse 0.8s infinite alternate ease-in-out; }
        .progress-bar-container { width: 280px; height: 16px; background: rgba(255, 255, 255, 0.9); border-radius: 12px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff7f50); border-radius: 12px; transition: width 0.05s linear; }
        #step-3 { display: none; width: 90%; max-width: 600px; z-index: 10; }
        .clean-card { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(20px); padding: 42px 36px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12); text-align: center; }
        .card-header { color: #2f3542; font-size: 26px; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
        .message-content { font-size: 15px; line-height: 1.8; color: #57606f; white-space: pre-line; font-weight: 600; text-align: left; }
        @keyframes heartPulse { from { transform: scale(1); } to { transform: scale(1.18); } }
    </style>
</head>
<body>

    <canvas id="art-canvas"></canvas>

    <div id="step-1">
        <button class="letter-btn" id="open-btn">Open Phyy Letter 💌</button>
    </div>

    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container"><div class="progress-bar" id="p-bar"></div></div>
        <div style="font-size: 15px; color: #2f3542; font-weight: 700; margin-top: 5px;">Opening your private letter...</div>
    </div>

    <div id="step-3">
        <div class="clean-card">
            <div class="card-header">Thê 🇻🇳 ❤️</div>
            <div class="message-content" id="typed-text"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('art-canvas');
            const ctx = canvas.getContext('2d');
            let grassBlades = [], flowers = [], clouds = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initEnvironment();
            }

            function initEnvironment() {
                grassBlades = [];
                const grassCount = Math.floor(canvas.width * 2.2);
                const startY = canvas.height * 0.62;
                const grassColors = ['#2ed573', '#26af5f', '#10ac84', '#7bed9f', '#05c46b'];

                for (let i = 0; i < grassCount; i++) {
                    grassBlades.push({
                        x: Math.random() * canvas.width,
                        y: startY + Math.random() * (canvas.height - startY),
                        height: Math.random() * 28 + 14,
                        curve: (Math.random() - 0.5) * 18,
                        color: grassColors[Math.floor(Math.random() * grassColors.length)],
                        windOffset: Math.random() * Math.PI * 2,
                        width: Math.random() * 1.5 + 1.2
                    });
                }

                flowers = [];
                const flowerCount = Math.floor(canvas.width * 0.12);
                for (let i = 0; i < flowerCount; i++) {
                    flowers.push({
                        x: Math.random() * canvas.width,
                        y: startY + 20 + Math.random() * (canvas.height - startY - 30),
                        size: Math.random() * 4 + 3,
                        type: Math.random() < 0.6 ? 'daisy' : 'pink'
                    });
                }

                clouds = [
                    { x: canvas.width * 0.15, y: canvas.height * 0.18, scale: 0.9, speed: 0.15 },
                    { x: canvas.width * 0.55, y: canvas.height * 0.12, scale: 1.2, speed: 0.2 },
                    { x: canvas.width * 0.82, y: canvas.height * 0.22, scale: 0.8, speed: 0.12 }
                ];
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const butterfly = {
                x: window.innerWidth * 0.5,
                y: window.innerHeight * 0.72,
                targetX: window.innerWidth * 0.5,
                targetY: window.innerHeight * 0.72,
                angle: 0
            };

            const catBlack = { x: window.innerWidth * 0.5 - 60, y: window.innerHeight * 0.78, color: '#1e272e', eyeColor: '#ffdd59' };
            const catGolden = { x: window.innerWidth * 0.5 + 60, y: window.innerHeight * 0.78, color: '#e1b12c', stripeColor: '#b37700', eyeColor: '#4cd137' };

            function drawCloud(cx, cy, scale) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                ctx.beginPath();
                ctx.arc(cx, cy, 35 * scale, 0, Math.PI * 2);
                ctx.arc(cx - 25 * scale, cy + 10 * scale, 25 * scale, 0, Math.PI * 2);
                ctx.arc(cx + 30 * scale, cy + 8 * scale, 28 * scale, 0, Math.PI * 2);
                ctx.arc(cx + 10 * scale, cy - 15 * scale, 26 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawDetailedButterfly(b, time) {
                ctx.save();
                ctx.translate(b.x, b.y);
                const wingSway = Math.sin(time * 15) * 0.7 + 0.3;

                // Glowing Effect
                ctx.shadowColor = 'rgba(255, 107, 129, 0.8)';
                ctx.shadowBlur = 10;

                // Left Wing
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.ellipse(-8 * wingSway, -4, 10 * wingSway, 7, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.ellipse(-6 * wingSway, -3, 5 * wingSway, 3, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Right Wing
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.ellipse(8 * wingSway, -4, 10 * wingSway, 7, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.ellipse(6 * wingSway, -3, 5 * wingSway, 3, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#2f3542';
                ctx.beginPath();
                ctx.ellipse(0, 0, 2, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Antennae
                ctx.strokeStyle = '#2f3542';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-1, -6); ctx.lineTo(-4, -12);
                ctx.moveTo(1, -6); ctx.lineTo(4, -12);
                ctx.stroke();

                ctx.restore();
            }

            function drawFacingBlackCat(c, time, isFacingRight) {
                ctx.save();
                ctx.translate(c.x, c.y + Math.sin(time * 3) * 2);
                const dir = isFacingRight ? 1 : -1;

                // Tail Wave
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-12 * dir, -2);
                ctx.quadraticCurveTo(-26 * dir, -20 + Math.sin(time * 4) * 10, -18 * dir, -34);
                ctx.stroke();

                // Body
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 19, 14, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head facing center
                ctx.beginPath();
                ctx.arc(12 * dir, -14, 12, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(4 * dir, -20); ctx.lineTo(8 * dir, -30); ctx.lineTo(14 * dir, -22);
                ctx.moveTo(13 * dir, -22); ctx.lineTo(18 * dir, -30); ctx.lineTo(22 * dir, -18);
                ctx.fill();

                // Eyes focused upward on butterfly
                ctx.fillStyle = c.eyeColor;
                ctx.beginPath();
                ctx.ellipse(16 * dir, -16, 3.5, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(16.5 * dir, -17, 1.2, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Whiskers
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(20 * dir, -12); ctx.lineTo(30 * dir, -14);
                ctx.moveTo(20 * dir, -10); ctx.lineTo(29 * dir, -8);
                ctx.stroke();

                ctx.restore();
            }

            function drawFacingGoldenCat(c, time, isFacingRight) {
                ctx.save();
                ctx.translate(c.x, c.y + Math.cos(time * 3) * 2);
                const dir = isFacingRight ? 1 : -1;

                // Tail
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-12 * dir, -2);
                ctx.quadraticCurveTo(-26 * dir, -18 + Math.cos(time * 4) * 10, -18 * dir, -32);
                ctx.stroke();

                // Body
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.fillStyle = c.stripeColor;
                ctx.beginPath();
                ctx.ellipse(-4 * dir, -4, 5, 10, 0.3 * dir, 0, Math.PI * 2);
                ctx.ellipse(4 * dir, -2, 4, 9, 0.1 * dir, 0, Math.PI * 2);
                ctx.fill();

                // Head facing center
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(12 * dir, -14, 12.5, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(5 * dir, -20); ctx.lineTo(9 * dir, -31); ctx.lineTo(15 * dir, -22);
                ctx.moveTo(14 * dir, -22); ctx.lineTo(19 * dir, -31); ctx.lineTo(23 * dir, -18);
                ctx.fill();

                // Eyes focused upward on butterfly
                ctx.fillStyle = c.eyeColor;
                ctx.beginPath();
                ctx.ellipse(16 * dir, -17, 3.5, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(16.5 * dir, -18, 1.2, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Whiskers
                ctx.strokeStyle = '#57606f';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(20 * dir, -11); ctx.lineTo(29 * dir, -13);
                ctx.moveTo(20 * dir, -9); ctx.lineTo(28 * dir, -7);
                ctx.stroke();

                ctx.restore();
            }

            function renderMasterpiece() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.002;

                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.65);
                skyGrad.addColorStop(0, '#0984e3');
                skyGrad.addColorStop(0.4, '#74b9ff');
                skyGrad.addColorStop(0.8, '#81ecec');
                skyGrad.addColorStop(1, '#eccc68');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Sun Glow
                const sunX = canvas.width * 0.78, sunY = canvas.height * 0.16;
                const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 200);
                sunGlow.addColorStop(0, 'rgba(255, 255, 230, 0.95)');
                sunGlow.addColorStop(0.3, 'rgba(255, 234, 167, 0.5)');
                sunGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = sunGlow;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Clouds
                clouds.forEach(c => {
                    c.x += c.speed;
                    if (c.x - 100 > canvas.width) c.x = -100;
                    drawCloud(c.x, c.y, c.scale);
                });

                // Meadow Ground
                const groundY = canvas.height * 0.62;
                const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
                groundGrad.addColorStop(0, '#2ed573');
                groundGrad.addColorStop(0.5, '#26af5f');
                groundGrad.addColorStop(1, '#10ac84');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                // Grass
                for (let i = 0; i < grassBlades.length; i++) {
                    const b = grassBlades[i];
                    const sway = Math.sin(time * 2.5 + b.windOffset) * 5;
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = b.width;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.quadraticCurveTo(b.x + b.curve, b.y - b.height * 0.5, b.x + b.curve + sway, b.y - b.height);
                    ctx.stroke();
                }

                // Flowers
                flowers.forEach(f => {
                    ctx.fillStyle = f.type === 'daisy' ? '#ffffff' : '#ff7675';
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fbc531';
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.size * 0.4, 0, Math.PI * 2); ctx.fill();
                });

                // Playful Butterfly Movement between Cats
                butterfly.angle += 0.08;
                const centerX = canvas.width * 0.5;
                butterfly.targetX = centerX + Math.sin(butterfly.angle) * 70;
                butterfly.targetY = canvas.height * 0.68 + Math.cos(butterfly.angle * 2) * 20;

                butterfly.x += (butterfly.targetX - butterfly.x) * 0.05;
                butterfly.y += (butterfly.targetY - butterfly.y) * 0.05;

                drawDetailedButterfly(butterfly, time);

                // Cats Positioning Facing Each Other
                catBlack.x = centerX - 75;
                catGolden.x = centerX + 75;

                drawFacingBlackCat(catBlack, time, true);   // Left cat facing Right
                drawFacingGoldenCat(catGolden, time, false); // Right cat facing Left

                requestAnimationFrame(renderMasterpiece);
            }

            renderMasterpiece();

            document.getElementById('open-btn').addEventListener('click', () => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 100, origin: { y: 0.6 } });
                }

                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'flex';

                let progress = 0;
                const progressBar = document.getElementById('p-bar');
                const interval = setInterval(() => {
                    progress += 4;
                    progressBar.style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                        document.getElementById('step-2').style.display = 'none';
                        document.getElementById('step-3').style.display = 'block';
                        typeWriterMessage();
                    }
                }, 30);
            });

            function typeWriterMessage() {
                const text = "Thê, you are a truly talented and capable girl. I sincerely respect, admire, and love you.\n\nYou are immensely valuable to me—one of a kind, irreplaceable. You might think I am exaggerating, but having met many people, I can confidently say no one comes close to your qualities.\n\nWhen I was surrounded by betrayal and completely broken, you became my sole emotional supporter. Your hard work, dedication, and endurance inspired me and gave me strength.\n\nThat is why I will try my best to take even better care of you. To stay away from other girls, I have shut down my main account and switched to a private account shared only with you and my closest friends. My attention belongs solely to you.\n\nSo, let us work hard and build our future together.";
                let index = 0;
                const target = document.getElementById('typed-text');
                target.innerHTML = "";

                function type() {
                    if (index < text.length) {
                        target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                        index++;
                        setTimeout(type, 30);
                    }
                }
                type();
            }
        });
    </script>
</body>
</html>
