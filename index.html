<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Romantic Sunset / Dusty Rose Dark Gradient Background */
            background: linear-gradient(135deg, #1a0b12 0%, #2a0e1d 50%, #3a1527 100%);
            color: #f3e5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #d81b60, #e91e63);
            color: #ffffff;
            border: none;
            padding: 20px 42px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(233, 30, 99, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(233, 30, 99, 0.8);
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 45px;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #f44336, #ffeb3b);
            border-radius: 10px;
            transition: width 0.05s linear;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        /* Elegant Glassmorphic Romantic Letter Box */
        .card-tilt {
            background: rgba(45, 18, 32, 0.85);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 182, 193, 0.25);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            animation: tilt3D 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes tilt3D {
            0% {
                transform: rotateY(-25deg) rotateX(12deg) scale(0.85);
            }
            50% {
                transform: rotateY(12deg) rotateX(-8deg) scale(1.03);
            }
            100% {
                transform: rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        /* Diagonal Sweeping Glow Beam Effect */
        .card-tilt::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                135deg,
                transparent 42%,
                rgba(255, 255, 255, 0.6) 48%,
                rgba(255, 105, 180, 0.8) 50%,
                rgba(255, 215, 0, 0.6) 52%,
                transparent 58%
            );
            pointer-events: none;
            animation: diagonalGlowSweep 2s ease-in-out 0.3s forwards;
        }

        @keyframes diagonalGlowSweep {
            0% {
                transform: translate(-50%, -50%);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translate(50%, 50%);
                opacity: 0;
            }
        }

        .card-header {
            color: #ff80ab;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
            text-shadow: 0 0 10px rgba(255, 128, 171, 0.3);
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #f3e5f5;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
        }

        .action-area {
            text-align: center;
        }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 18px rgba(0, 104, 255, 0.4);
            transition: transform 0.2s;
        }

        .zalo-btn:hover {
            transform: translateY(-2px);
        }

        /* Diagonal Falling Flowers (Sprinkling Like Water) */
        .falling-flower {
            position: fixed;
            z-index: 5;
            user-select: none;
            pointer-events: none;
            animation: diagonalRain linear forwards;
        }

        @keyframes diagonalRain {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(250px, 115vh) rotate(360deg);
            }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- 1. Open Button -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">
            Open Phyy Letter 💌
        </button>
    </div>

    <!-- 2. Loading Bar -->
    <div id="step-2">
        <div class="heart-icon">💖</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #f8bbd0;">Opening your private letter...</div>
    </div>

    <!-- 3. Final Interface -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">
                A NEW CHAPTER 🇻🇳 ❤️
            </div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('open-btn').addEventListener('click', function(e) {
            createExplosion(e.clientX, e.clientY);

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';

            let progress = 0;
            const progressBar = document.getElementById('p-bar');
            const interval = setInterval(() => {
                progress += 2;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showMainInterface, 300);
                }
            }, 30);
        });

        function createExplosion(x, y) {
            const items = ['❤️', '🇻🇳', '✨', '💖', '🌸'];
            for (let i = 0; i < 24; i++) {
                const el = document.createElement('div');
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.position = 'fixed';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.fontSize = '22px';
                el.style.pointerEvents = 'none';
                el.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
                document.body.appendChild(el);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;

                setTimeout(() => {
                    el.style.transform = `translate(${tx}px, ${ty}px) scale(1.4)`;
                    el.style.opacity = '0';
                }, 10);

                setTimeout(() => el.remove(), 1000);
            }
        }

        function showMainInterface() {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'block';

            // Glow Sweep အနောက်မှ လေယာဉ် ရေဖျန်းသကဲ့သို့ ပန်းပွင့်များ ထောင့်ဖြတ် ကျလာမည်
            setTimeout(createDiagonalFlowerShower, 300);

            // Message Typewriter
            typeWriterMessage();
        }

        function createDiagonalFlowerShower() {
            const flowers = ['🌸', '🌺', '🌹', '✨', '🌷'];
            const count = 35;

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.className = 'falling-flower';
                    flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    
                    // ဘယ်ဘက် အပေါ်ထောင့်နားမှ စတင်ကျဆင်းမည်
                    flower.style.left = (Math.random() * 120 - 20) + 'vw';
                    flower.style.top = '-10vh';
                    
                    flower.style.fontSize = (Math.random() * 14 + 16) + 'px';
                    flower.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';
                    
                    document.body.appendChild(flower);

                    setTimeout(() => flower.remove(), 4500);
                }, i * 90); // ရေဖျန်းသကဲ့သို့ ဆက်တိုက် တစိမ့်စိမ့် ကျဆင်းစေခြင်း
            }
        }

        function typeWriterMessage() {
            const text = "I have shut down my main accounts and cut out every unnecessary distraction.\n\nYour dedication, loyalty, and actions showed me what really matters. My energy and focus belong completely to our future now.\n\nNo distractions. Just us.";
            let index = 0;
            const target = document.getElementById('typed-text');

            function type() {
                if (index < text.length) {
                    target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                    index++;
                    setTimeout(type, 35);
                }
            }
            type();
        }
    </script>
</body>
</html>
