<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
            position: relative;
            background: #ffebee;
        }

        /* ----- Masterpiece Canvas Background ----- */
        #art-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ----- Bright Outer Pink Glow Frame ----- */
        .screen-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255, 128, 171, 0.8);
            box-shadow: inset 0 0 30px #ff80ab, inset 0 0 60px rgba(255, 64, 129, 0.3);
            pointer-events: none;
            z-index: 20;
            animation: singlePinkBreathe 2.5s infinite alternate ease-in-out;
        }

        @keyframes singlePinkBreathe {
            0% {
                border-color: rgba(255, 128, 171, 0.5);
                box-shadow: inset 0 0 20px #ff80ab, inset 0 0 40px rgba(255, 64, 129, 0.2);
            }
            100% {
                border-color: rgba(255, 128, 171, 1);
                box-shadow: inset 0 0 40px #ff80ab, inset 0 0 80px rgba(255, 64, 129, 0.5);
            }
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            color: #ffffff;
            border: none;
            padding: 20px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px #ff80ab;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 45px #ff4081;
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 48px;
            color: #ff4081;
            text-shadow: 0 0 20px #ff80ab;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff80ab;
            box-shadow: 0 0 15px #ff80ab;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4081;
            border-radius: 10px;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px #ff4081;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        .card-tilt {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #ff80ab;
            box-shadow: 0 0 35px #ff80ab, 0 0 70px rgba(255, 64, 129, 0.3);
            position: relative;
            animation: tilt3D 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       boxSingleGlow 2.5s infinite alternate ease-in-out 2.2s;
        }

        @keyframes boxSingleGlow {
            0% {
                border-color: rgba(255, 128, 171, 0.6);
                box-shadow: 0 0 20px #ff80ab, 0 0 40px rgba(255, 64, 129, 0.3);
            }
            100% {
                border-color: rgba(255, 128, 171, 1);
                box-shadow: 0 0 40px #ff80ab, 0 0 80px rgba(255, 64, 129, 0.6);
            }
        }

        @keyframes tilt3D {
            0% { transform: rotateY(-25deg) rotateX(12deg) scale(0.85); }
            50% { transform: rotateY(12deg) rotateX(-8deg) scale(1.03); }
            100% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
        }

        .card-header {
            color: #da251d;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #4a148c;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
            font-weight: 600;
        }

        .action-area { text-align: center; }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 104, 255, 0.5);
            transition: transform 0.2s;
        }

        .zalo-btn:hover { transform: translateY(-2px); }

        .svg-petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: verticalRain linear forwards;
        }

        @keyframes verticalRain {
            0% { opacity: 0; transform: translateY(0) rotate(0deg); }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; }
            100% { opacity: 0; transform: translateY(115vh) rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Canvas Engine for Masterpiece Art -->
    <canvas id="art-canvas"></canvas>

    <!-- Outer Screen Frame Glow -->
    <div class="screen-glow"></div>

    <!-- Step 1 -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">Open Phyy Letter 💌</button>
    </div>

    <!-- Step 2 -->
    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #880e4f; font-weight: 700;">Opening your private letter...</div>
    </div>

    <!-- Step 3 -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">A NEW CHAPTER 🇻🇳 ❤️</div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateGrassBlades();
        }

        // Generate Micro Grass Blade Details
        let grassBlades = [];
        function generateGrassBlades() {
            grassBlades = [];
            const count = Math.floor(canvas.width * 1.2); // Saturated Micro Blades
            const grassStartY = canvas.height * 0.65;
            
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = grassStartY + Math.random() * (canvas.height - grassStartY);
                const height = Math.random() * 22 + 12;
                const curve = (Math.random() - 0.5) * 15;
                const shade = Math.random();
                
                // Color Palette for Grass Details
                let color;
                if (shade < 0.33) color = '#7ec850';
                else if (shade < 0.66) color = '#5ba829';
                else color = '#3d7e17';

                grassBlades.push({ x, y, height, curve, color, windOffset: Math.random() * Math.PI * 2 });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Butterfly Entity
        const butterfly = {
            x: canvas.width * 0.5,
            y: canvas.height * 0.7,
            targetX: canvas.width * 0.5,
            targetY: canvas.height * 0.7,
            angle: 0
        };

        // Black Cat
        const catBlack = {
            x: canvas.width * 0.3,
            y: canvas.height * 0.8,
            targetX: canvas.width * 0.3,
            jumpHeight: 0,
            isJumping: false,
            color: '#1a1a1a',
            eyeColor: '#ffeb3b'
        };

        // Golden-Brown Cat
        const catGolden = {
            x: canvas.width * 0.4,
            y: canvas.height * 0.83,
            targetX: canvas.width * 0.4,
            jumpHeight: 0,
            isJumping: false,
            color: '#d48817',
            patchColor: '#8c5005',
            eyeColor: '#4caf50'
        };

        // Sun & Atmospheric Particles
        const sparkles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2.5 + 1,
            speedY: -Math.random() * 0.6 - 0.2,
            opacity: Math.random()
        }));

        function renderMasterpieceArt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const time = Date.now() * 0.0025;

            // 1. High Dynamic Bright Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.75);
            skyGrad.addColorStop(0, '#ff9a9e');
            skyGrad.addColorStop(0.35, '#fecfef');
            skyGrad.addColorStop(0.7, '#a1c4fd');
            skyGrad.addColorStop(1, '#c2e9fb');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sunlight Bloom
            const sunGrad = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.25, 10, canvas.width * 0.8, canvas.height * 0.25, 280);
            sunGrad.addColorStop(0, 'rgba(255, 255, 220, 0.8)');
            sunGrad.addColorStop(0.4, 'rgba(255, 224, 178, 0.35)');
            sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Volumetric Textured Cloud Layers
            drawCloud(canvas.width * 0.2, canvas.height * 0.22, 90, 'rgba(255, 255, 255, 0.6)');
            drawCloud(canvas.width * 0.65, canvas.height * 0.18, 110, 'rgba(255, 255, 255, 0.5)');

            // 3. Ground Base Shadow & Base Gradient
            const groundBaseY = canvas.height * 0.65;
            const groundGrad = ctx.createLinearGradient(0, groundBaseY, 0, canvas.height);
            groundGrad.addColorStop(0, '#9cd84e');
            groundGrad.addColorStop(0.4, '#5ba829');
            groundGrad.addColorStop(1, '#2d5c0e');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundBaseY, canvas.width, canvas.height - groundBaseY);

            // 4. Render Micro Grass Blades (High Detail)
            ctx.lineWidth = 1.8;
            for (let i = 0; i < grassBlades.length; i++) {
                const b = grassBlades[i];
                const sway = Math.sin(time * 2 + b.windOffset) * 4;
                ctx.strokeStyle = b.color;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.quadraticCurveTo(b.x + b.curve, b.y - b.height * 0.5, b.x + b.curve + sway, b.y - b.height);
                ctx.stroke();
            }

            // 5. Update Butterfly
            butterfly.angle += 0.12;
            if (Math.random() < 0.02) {
                butterfly.targetX = Math.random() * (canvas.width * 0.7) + canvas.width * 0.15;
                butterfly.targetY = canvas.height * 0.64 + Math.random() * (canvas.height * 0.2);
            }
            butterfly.x += (butterfly.targetX - butterfly.x) * 0.035;
            butterfly.y += (butterfly.targetY - butterfly.y) * 0.035 + Math.sin(butterfly.angle) * 1.8;

            // Render Butterfly
            ctx.fillStyle = '#e91e63';
            const wingWidth = Math.abs(Math.sin(butterfly.angle * 2.5)) * 10 + 4;
            ctx.beginPath();
            ctx.ellipse(butterfly.x - 4, butterfly.y, wingWidth, 7, 0.3, 0, Math.PI * 2);
            ctx.ellipse(butterfly.x + 4, butterfly.y, wingWidth, 7, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // 6. Cats Logic & Rendering
            updateCat(catBlack, butterfly.x - 45, time, 0);
            updateCat(catGolden, butterfly.x + 25, time, 1);

            drawCat(catBlack, time);
            drawGoldenCat(catGolden, time);

            // 7. Atmospheric Sun Gold Sparkles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            sparkles.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                s.y += s.speedY;
                if (s.y < 0) s.y = canvas.height;
            });

            requestAnimationFrame(renderMasterpieceArt);
        }

        function drawCloud(cx, cy, radius, fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
            ctx.arc(cx - radius * 0.4, cy + 10, radius * 0.35, 0, Math.PI * 2);
            ctx.arc(cx + radius * 0.4, cy + 10, radius * 0.38, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateCat(cat, targetX, time, offset) {
            cat.targetX = targetX;
            cat.x += (cat.targetX - cat.x) * 0.035;
            cat.y = canvas.height * 0.81 + Math.sin(time * 2.5 + offset) * 3;

            if (Math.abs(cat.x - targetX) < 25 && !cat.isJumping && Math.random() < 0.03) {
                cat.isJumping = true;
                cat.jumpHeight = 26;
            }

            if (cat.isJumping) {
                cat.jumpHeight -= 1.4;
                if (cat.jumpHeight <= 0) {
                    cat.jumpHeight = 0;
                    cat.isJumping = false;
                }
            }
        }

        // Draw Black Cat
        function drawCat(c, time) {
            const renderY = c.y - c.jumpHeight;
            ctx.save();
            ctx.translate(c.x, renderY);

            // Tail
            ctx.strokeStyle = c.color;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-12, -4);
            ctx.quadraticCurveTo(-26, -22 + Math.sin(time * 4) * 8, -18, -32);
            ctx.stroke();

            // Body
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(12, -12, 11, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.beginPath();
            ctx.moveTo(5, -18); ctx.lineTo(9, -27); ctx.lineTo(14, -20);
            ctx.moveTo(13, -20); ctx.lineTo(18, -27); ctx.lineTo(21, -16);
            ctx.fill();

            // Yellow Eye
            ctx.fillStyle = c.eyeColor;
            ctx.beginPath();
            ctx.arc(17, -13, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw Golden-Brown Cat
        function drawGoldenCat(c, time) {
            const renderY = c.y - c.jumpHeight;
            ctx.save();
            ctx.translate(c.x, renderY);

            // Tail
            ctx.strokeStyle = c.color;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-12, -4);
            ctx.quadraticCurveTo(-25, -20 + Math.cos(time * 4) * 8, -16, -30);
            ctx.stroke();

            // Body
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Dark Brown Patches Detail
            ctx.fillStyle = c.patchColor;
            ctx.beginPath();
            ctx.ellipse(-3, -3, 9, 7, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.arc(13, -12, 11.5, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.beginPath();
            ctx.moveTo(6, -18); ctx.lineTo(10, -27); ctx.lineTo(15, -20);
            ctx.moveTo(14, -20); ctx.lineTo(19, -27); ctx.lineTo(22, -16);
            ctx.fill();

            // Green Eyes & Blush
            ctx.fillStyle = c.eyeColor;
            ctx.beginPath();
            ctx.arc(18, -13, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff80ab';
            ctx.beginPath();
            ctx.arc(16, -9, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        renderMasterpieceArt();

        /* ----- UI Interactivity ----- */
        document.getElementById('open-btn').addEventListener('click', function() {
            confetti({
                particleCount: 90,
                spread: 110,
                origin: { y: 0.6 },
                colors: ['#da251d', '#ff1744', '#ffc107', '#ff4081']
            });

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';

            let progress = 0;
            const progressBar = document.getElementById('p-bar');
            const interval = setInterval(() => {
                progress += 2;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showMainInterface, 300);
                }
            }, 30);
        });

        function showMainInterface() {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'block';

            setTimeout(createFlowerShower, 300);
            typeWriterMessage();
        }

        function createFlowerShower() {
            const count = 35;
            const petalColors = ['#ff80ab', '#ff4081', '#f48fb1', '#e91e63'];

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'svg-petal';
                    const size = Math.random() * 12 + 16;
                    const color = petalColors[Math.floor(Math.random() * petalColors.length)];

                    petal.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
                            <path d="M12 2C9 7 4 9 4 14c0 4.4 3.6 8 8 8s8-3.6 8-8c0-5-5-7-8-12z"/>
                        </svg>
                    `;

                    petal.style.left = (Math.random() * 100) + 'vw';
                    petal.style.top = '-10vh';
                    petal.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';

                    document.body.appendChild(petal);
                    setTimeout(() => petal.remove(), 4500);
                }, i * 90
