<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy's Letter</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #eef2f5; }
        #art-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #step-1 { text-align: center; z-index: 10; }
        .letter-btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; border: none; padding: 22px 50px; font-size: 22px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 15px 35px rgba(255, 71, 87, 0.35); transition: all 0.3s; }
        .letter-btn:hover { transform: translateY(-3px) scale(1.05); }
        #step-2 { display: none; flex-direction: column; align-items: center; gap: 16px; z-index: 10; }
        .heart-icon { font-size: 52px; color: #ff4757; animation: heartPulse 0.8s infinite alternate ease-in-out; }
        .progress-bar-container { width: 280px; height: 16px; background: rgba(255, 255, 255, 0.9); border-radius: 12px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff7f50); border-radius: 12px; transition: width 0.05s linear; }
        #step-3 { display: none; width: 90%; max-width: 600px; z-index: 10; }
        .clean-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); padding: 35px 30px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12); text-align: center; max-height: 85vh; display: flex; flex-direction: column; }
        .card-header { color: #2f3542; font-size: 26px; font-weight: 800; margin-bottom: 15px; letter-spacing: 1px; flex-shrink: 0; }
        .scroll-container { overflow-y: auto; padding-right: 10px; max-height: 50vh; text-align: left; -webkit-overflow-scrolling: touch; }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #ff6b81; border-radius: 10px; }
        .message-content { font-size: 15px; line-height: 1.8; color: #57606f; white-space: pre-line; font-weight: 600; }
        .signature { margin-top: 25px; text-align: right; font-size: 20px; font-weight: 800; color: #ff4757; font-style: italic; letter-spacing: 1.5px; border-top: 1px solid #e0e0e0; padding-top: 10px; }
        @keyframes heartPulse { from { transform: scale(1); } to { transform: scale(1.18); } }
    </style>
</head>
<body>

    <canvas id="art-canvas"></canvas>

    <div id="step-1">
        <button class="letter-btn" id="open-btn">Open Phyy's Letter 💌</button>
    </div>

    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container"><div class="progress-bar" id="p-bar"></div></div>
        <div style="font-size: 15px; color: #2f3542; font-weight: 700; margin-top: 5px;">Opening your private letter...</div>
    </div>

    <div id="step-3">
        <div class="clean-card">
            <div class="card-header">Thê 🇻🇳 ❤️</div>
            <div class="scroll-container" id="scroll-box">
                <div class="message-content" id="typed-text"></div>
                <div class="signature">~ PHM.phyo ~</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('art-canvas');
            const ctx = canvas.getContext('2d');
            let grassBlades = [], detailedFlowers = [], floatingPetals = [], clouds = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initEnvironment();
            }

            function initEnvironment() {
                grassBlades = [];
                const grassCount = Math.floor(canvas.width * 2.5);
                const startY = canvas.height * 0.62;
                const grassColors = ['#2ed573', '#26af5f', '#10ac84', '#7bed9f', '#05c46b'];

                for (let i = 0; i < grassCount; i++) {
                    grassBlades.push({
                        x: Math.random() * canvas.width,
                        y: startY + Math.random() * (canvas.height - startY),
                        height: Math.random() * 25 + 15,
                        color: grassColors[Math.floor(Math.random() * grassColors.length)],
                        offset: Math.random() * Math.PI * 2,
                        width: Math.random() * 1.5 + 1
                    });
                }

                detailedFlowers = [];
                const flowerCount = Math.floor(canvas.width * 0.08);
                const petalColors = ['#ff7675', '#ff9ff3', '#feca57', '#ffffff', '#ff6b6b'];

                for (let i = 0; i < flowerCount; i++) {
                    detailedFlowers.push({
                        x: Math.random() * canvas.width,
                        y: startY + 25 + Math.random() * (canvas.height - startY - 50),
                        stemHeight: Math.random() * 25 + 20,
                        petalColor: petalColors[Math.floor(Math.random() * petalColors.length)],
                        petalCount: Math.floor(Math.random() * 2) + 5,
                        size: Math.random() * 4 + 5,
                        offset: Math.random() * Math.PI * 2
                    });
                }

                floatingPetals = [];
                for (let i = 0; i < 25; i++) {
                    floatingPetals.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 3 + 3,
                        color: petalColors[Math.floor(Math.random() * petalColors.length)],
                        vx: Math.random() * 1 + 0.5,
                        vy: Math.random() * 0.8 + 0.3,
                        angle: Math.random() * Math.PI * 2,
                        spin: (Math.random() - 0.5) * 0.05
                    });
                }

                clouds = [
                    { x: 50, y: canvas.height * 0.12, scale: 0.9, speed: 0.3 },
                    { x: canvas.width * 0.4, y: canvas.height * 0.08, scale: 1.2, speed: 0.4 },
                    { x: canvas.width * 0.75, y: canvas.height * 0.15, scale: 0.8, speed: 0.25 }
                ];
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const butterfly = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.65 };

            // Dynamic Cats Objects with Running and Jumping Physics
            const catBlack = {
                x: window.innerWidth * 0.5 - 120,
                y: window.innerHeight * 0.76,
                targetX: window.innerWidth * 0.5 - 120,
                color: '#1e272e',
                eyeColor: '#ffdd59',
                facing: 1 // 1 for right, -1 for left
            };

            const catGolden = {
                x: window.innerWidth * 0.5 + 120,
                y: window.innerHeight * 0.76,
                targetX: window.innerWidth * 0.5 + 120,
                color: '#d35400',
                eyeColor: '#2ecc71',
                facing: -1
            };

            function drawCloud(c) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(c.x, c.y, 30 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x - 20 * c.scale, c.y + 8 * c.scale, 20 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 25 * c.scale, c.y + 6 * c.scale, 22 * c.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawButterfly(x, y, time) {
                ctx.save();
                ctx.translate(x, y);
                const wing = Math.sin(time * 18) * 9 + 2;

                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.ellipse(-wing/2, -2, Math.abs(wing), 7, -0.2, 0, Math.PI * 2);
                ctx.ellipse(wing/2, -2, Math.abs(wing), 7, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.ellipse(-wing/3, -2, Math.abs(wing/2), 4, -0.2, 0, Math.PI * 2);
                ctx.ellipse(wing/3, -2, Math.abs(wing/2), 4, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2f3542';
                ctx.beginPath();
                ctx.ellipse(0, 0, 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawDetailedFlower(f, time) {
                ctx.save();
                const sway = Math.sin(time * 2 + f.offset) * 4;
                const topX = f.x + sway;
                const topY = f.y - f.stemHeight;

                ctx.strokeStyle = '#10ac84';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.quadraticCurveTo(f.x + sway * 0.5, f.y - f.stemHeight * 0.5, topX, topY);
                ctx.stroke();

                ctx.fillStyle = '#10ac84';
                ctx.beginPath();
                ctx.ellipse(f.x + sway * 0.3 - 4, f.y - f.stemHeight * 0.4, 6, 3, -0.5, 0, Math.PI * 2);
                ctx.ellipse(f.x + sway * 0.3 + 4, f.y - f.stemHeight * 0.5, 6, 3, 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = f.petalColor;
                for (let i = 0; i < f.petalCount; i++) {
                    const angle = (i * Math.PI * 2) / f.petalCount;
                    const px = topX + Math.cos(angle) * f.size;
                    const py = topY + Math.sin(angle) * f.size;
                    ctx.beginPath();
                    ctx.arc(px, py, f.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#fbc531';
                ctx.beginPath();
                ctx.arc(topX, topY, f.size * 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Universal Dynamic Cat Drawer (Running, Jumping & Eye Tracking)
            function drawDynamicCat(cat, time, targetX, targetY) {
                ctx.save();

                // Smooth Horizontal Chase Movement
                cat.targetX = targetX + (cat.facing * -40);
                cat.x += (cat.targetX - cat.x) * 0.035;
                if (targetX > cat.x + 10) cat.facing = 1;
                else if (targetX < cat.x - 10) cat.facing = -1;

                // Running & Jumping Physics
                const isMoving = Math.abs(cat.targetX - cat.x) > 5;
                const runBob = isMoving ? Math.abs(Math.sin(time * 12)) * 6 : 0;
                const distToButterfly = Math.hypot(targetX - cat.x, targetY - cat.y);
                const jumpOffset = (distToButterfly < 120 && Math.sin(time * 4) > 0) ? Math.sin(time * 4) * 32 : 0;

                const posY = cat.y - jumpOffset - runBob;

                ctx.translate(cat.x, posY);
                ctx.scale(cat.facing, 1); // Flip horizontally depending on facing direction

                // Body
                ctx.fillStyle = cat.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
                ctx.fill();

                // Reaching Paw
                const pawY = (jumpOffset > 5) ? -12 - Math.sin(time * 8) * 8 : -2 + Math.sin(time * 10) * 4;
                ctx.strokeStyle = cat.color;
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(8, -2);
                ctx.lineTo(22, pawY);
                ctx.stroke();

                // Head
                ctx.beginPath();
                ctx.arc(10, -14, 11, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(3, -20); ctx.lineTo(7, -28); ctx.lineTo(12, -22);
                ctx.moveTo(11, -22); ctx.lineTo(16, -28); ctx.lineTo(19, -18);
                ctx.fill();

                // Dynamic Eye Tracking
                const headRealX = cat.x + (10 * cat.facing);
                const angle = Math.atan2(targetY - (posY - 14), targetX - headRealX);
                const ex = Math.cos(angle) * 2.2 * cat.facing;
                const ey = Math.sin(angle) * 2.2;

                ctx.fillStyle = cat.eyeColor;
                ctx.beginPath();
                ctx.arc(14, -15, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(14 + ex, -15 + ey, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.003;

                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.62);
                skyGrad.addColorStop(0, '#74b9ff');
                skyGrad.addColorStop(1, '#eccc68');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.62);

                // Clouds
                clouds.forEach(c => {
                    c.x += c.speed;
                    if (c.x - 60 > canvas.width) c.x = -60;
                    drawCloud(c);
                });

                // Ground
                const groundY = canvas.height * 0.62;
                ctx.fillStyle = '#2ed573';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                // Grass
                grassBlades.forEach(b => {
                    const sway = Math.sin(time * 3 + b.offset) * 5;
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = b.width;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(b.x + sway, b.y - b.height);
                    ctx.stroke();
                });

                // Flowers
                detailedFlowers.forEach(f => {
                    drawDetailedFlower(f, time);
                });

                // Petals
                floatingPetals.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;

                    if (p.x > canvas.width) p.x = -10;
                    if (p.y > canvas.height) p.y = -10;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Butterfly Flying Pattern across the screen
                const centerX = canvas.width * 0.5;
                butterfly.x = centerX + Math.sin(time * 1.5) * (canvas.width * 0.28);
                butterfly.y = canvas.height * 0.63 + Math.cos(time * 3) * 35;
                drawButterfly(butterfly.x, butterfly.y, time);

                // Draw both Cats chasing, running and jumping after the butterfly
                catBlack.y = canvas.height * 0.76;
                catGolden.y = canvas.height * 0.76;

                drawDynamicCat(catBlack, time, butterfly.x, butterfly.y);
                drawDynamicCat(catGolden, time, butterfly.x, butterfly.y);

                requestAnimationFrame(animate);
            }

            animate();

            // Button Event
            document.getElementById('open-btn').addEventListener('click', () => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 } });
                }

                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'flex';

                let progress = 0;
                const progressBar = document.getElementById('p-bar');
                const interval = setInterval(() => {
                    progress += 5;
                    progressBar.style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                        document.getElementById('step-2').style.display = 'none';
                        document.getElementById('step-3').style.display = 'block';
                        typeWriterMessage();
                    }
                }, 30);
            });

            // Typewriter with manual scroll support
            function typeWriterMessage() {
                const text = "Thê, you are a truly talented and capable girl. I sincerely respect, admire, and love you.\n\nYou are immensely valuable to me—one of a kind, irreplaceable. You might think I am exaggerating, but having met many people, I can confidently say no one comes close to your qualities.\n\nWhen I was surrounded by betrayal and completely broken, you became my sole emotional supporter. Your hard work, dedication, and endurance inspired me and gave me strength.\n\nThat is why I will try my best to take even better care of you. To stay away from other girls, I have shut down my main account and switched to a private account shared only with you and my closest friends. My attention belongs solely to you.\n\nSo, let us work hard and build our future together.";
                let index = 0;
                const target = document.getElementById('typed-text');
                const scrollBox = document.getElementById('scroll-box');
                target.innerHTML = "";

                let userScrolledUp = false;

                scrollBox.addEventListener('scroll', () => {
                    const isAtBottom = scrollBox.scrollHeight - scrollBox.clientHeight - scrollBox.scrollTop < 30;
                    userScrolledUp = !isAtBottom;
                });

                function type() {
                    if (index < text.length) {
                        target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                        index++;

                        if (!userScrolledUp) {
                            scrollBox.scrollTop = scrollBox.scrollHeight;
                        }

                        setTimeout(type, 75);
                    }
                }
                type();
            }
        });
    </script>
</body>
    </html>
