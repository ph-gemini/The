<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy Letter</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
            position: relative;
        }

        /* ----- Anime Canvas Background ----- */
        #anime-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ----- Screen Outer Border Single Pink Glow (ဖုန်း/စခရင် ဘောင်အနား လင်းလက်မှု) ----- */
        .screen-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 4px solid #ff80ab;
            box-shadow: inset 0 0 25px #ff80ab, inset 0 0 50px #ff4081;
            pointer-events: none;
            z-index: 20;
            animation: singlePinkBreathe 2.5s infinite alternate ease-in-out;
        }

        @keyframes singlePinkBreathe {
            0% {
                border-color: rgba(255, 128, 171, 0.5);
                box-shadow: inset 0 0 15px #ff80ab, inset 0 0 30px #ff4081;
            }
            100% {
                border-color: rgba(255, 128, 171, 1);
                box-shadow: inset 0 0 35px #ff80ab, inset 0 0 70px #ff4081;
            }
        }

        /* ----- Step 1: Open Button ----- */
        #step-1 {
            text-align: center;
            z-index: 10;
        }

        .letter-btn {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            color: #ffffff;
            border: none;
            padding: 20px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff80ab;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .letter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #ff4081;
        }

        /* ----- Step 2: Loading Bar ----- */
        #step-2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .heart-icon {
            font-size: 48px;
            color: #ff4081;
            text-shadow: 0 0 20px #ff80ab;
            animation: pulse 0.8s infinite alternate;
        }

        .progress-bar-container {
            width: 260px;
            height: 16px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff80ab;
            box-shadow: 0 0 15px #ff80ab;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4081;
            border-radius: 10px;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px #ff4081;
        }

        /* ----- Step 3: Main Interface ----- */
        #step-3 {
            display: none;
            width: 90%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        /* Elegant Glass Card with Single Pink Glow Border */
        .card-tilt {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #ff80ab;
            box-shadow: 0 0 30px #ff80ab, 0 0 60px rgba(255, 64, 129, 0.4);
            position: relative;
            animation: tilt3D 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       boxSingleGlow 2.5s infinite alternate ease-in-out 2.2s;
        }

        @keyframes boxSingleGlow {
            0% {
                border-color: rgba(255, 128, 171, 0.6);
                box-shadow: 0 0 20px #ff80ab, 0 0 40px rgba(255, 64, 129, 0.3);
            }
            100% {
                border-color: rgba(255, 128, 171, 1);
                box-shadow: 0 0 40px #ff80ab, 0 0 80px rgba(255, 64, 129, 0.6);
            }
        }

        @keyframes tilt3D {
            0% {
                transform: rotateY(-25deg) rotateX(12deg) scale(0.85);
            }
            50% {
                transform: rotateY(12deg) rotateX(-8deg) scale(1.03);
            }
            100% {
                transform: rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        .card-header {
            color: #da251d;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 1.2px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.9;
            color: #4a148c;
            white-space: pre-line;
            margin-bottom: 30px;
            min-height: 130px;
            font-weight: 600;
        }

        .action-area {
            text-align: center;
        }

        .zalo-btn {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            color: #ffffff;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 104, 255, 0.5);
            transition: transform 0.2s;
        }

        .zalo-btn:hover {
            transform: translateY(-2px);
        }

        /* SVG Vector Petals */
        .svg-petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: verticalRain linear forwards;
        }

        @keyframes verticalRain {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                opacity: 0;
                transform: translateY(115vh) rotate(360deg);
            }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Anime Canvas Background with Playful Cat -->
    <canvas id="anime-bg"></canvas>

    <!-- Screen Outer Edge Single Glow -->
    <div class="screen-glow"></div>

    <!-- 1. Open Button -->
    <div id="step-1">
        <button class="letter-btn" id="open-btn">
            Open Phyy Letter 💌
        </button>
    </div>

    <!-- 2. Loading Bar -->
    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <div style="font-size: 14px; color: #880e4f; font-weight: 700;">Opening your private letter...</div>
    </div>

    <!-- 3. Final Interface -->
    <div id="step-3">
        <div class="card-tilt">
            <div class="card-header">
                A NEW CHAPTER 🇻🇳 ❤️
            </div>
            <div class="message-content" id="typed-text"></div>
            <div class="action-area">
                <a href="https://zalo.me" class="zalo-btn">Connect on Zalo</a>
            </div>
        </div>
    </div>

    <script>
        /* ----- Pure Code Anime Grassland & Playful Cat Animation ----- */
        const canvas = document.getElementById('anime-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Floating Dandelion Particles
        const particles = Array.from({ length: 30 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 1,
            dx: Math.random() * 1 + 0.3,
            dy: Math.random() * -0.6 - 0.2
        }));

        // Butterfly State
        const butterfly = {
            x: window.innerWidth * 0.3,
            y: window.innerHeight * 0.72,
            targetX: window.innerWidth * 0.3,
            targetY: window.innerHeight * 0.72,
            angle: 0
        };

        // Cat State
        const cat = {
            x: window.innerWidth * 0.2,
            y: window.innerHeight * 0.78,
            targetX: window.innerWidth * 0.2,
            tailAngle: 0,
            earAngle: 0,
            isJumping: false,
            jumpHeight: 0
        };

        function drawAnimeBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Anime Sunset Sky Gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.75);
            skyGradient.addColorStop(0, '#ff9a9e');
            skyGradient.addColorStop(0.5, '#fecfef');
            skyGradient.addColorStop(1, '#a1c4fd');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Anime Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.2, canvas.height * 0.25, 50, 0, Math.PI * 2);
            ctx.arc(canvas.width * 0.25, canvas.height * 0.22, 65, 0, Math.PI * 2);
            ctx.arc(canvas.width * 0.3, canvas.height * 0.25, 50, 0, Math.PI * 2);
            ctx.fill();

            // 3. Anime Grassland Waves
            const time = Date.now() * 0.002;
            
            // Back Hill
            ctx.fillStyle = '#a8e6cf';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 10) {
                ctx.lineTo(x, canvas.height * 0.68 + Math.sin(x * 0.005 + time) * 12);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            // Front Hill
            ctx.fillStyle = '#56ab2f';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 10) {
                ctx.lineTo(x, canvas.height * 0.76 + Math.cos(x * 0.008 + time * 1.2) * 15);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            // 4. Update & Draw Butterfly
            butterfly.angle += 0.1;
            if (Math.random() < 0.02) {
                butterfly.targetX = Math.random() * (canvas.width * 0.7) + canvas.width * 0.15;
                butterfly.targetY = canvas.height * 0.65 + Math.random() * 60;
            }
            butterfly.x += (butterfly.targetX - butterfly.x) * 0.03;
            butterfly.y += (butterfly.targetY - butterfly.y) * 0.03 + Math.sin(butterfly.angle) * 1.5;

            // Draw Butterfly
            ctx.fillStyle = '#ff4081';
            const wingSize = Math.abs(Math.sin(butterfly.angle * 2)) * 8 + 4;
            ctx.beginPath();
            ctx.ellipse(butterfly.x - 4, butterfly.y, wingSize, 6, 0.3, 0, Math.PI * 2);
            ctx.ellipse(butterfly.x + 4, butterfly.y, wingSize, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // 5. Update & Draw Playful Anime Cat
            cat.targetX = butterfly.x - 35;
            cat.x += (cat.targetX - cat.x) * 0.04;
            cat.y = canvas.height * 0.77 + Math.sin(time * 3) * 3;

            // Jump Action when close to butterfly
            if (Math.abs(cat.x - (butterfly.x - 35)) < 15 && !cat.isJumping && Math.random() < 0.05) {
                cat.isJumping = true;
                cat.jumpHeight = 22;
            }
            if (cat.isJumping) {
                cat.jumpHeight -= 1.2;
                if (cat.jumpHeight <= 0) {
                    cat.jumpHeight = 0;
                    cat.isJumping = false;
                }
            }

            const renderCatY = cat.y - cat.jumpHeight;

            // Draw Cat Body (White/Orange Cute Anime Style)
            ctx.save();
            ctx.translate(cat.x, renderCatY);

            // Tail
            ctx.strokeStyle = '#ffa726';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-15, -5);
            ctx.quadraticCurveTo(-30, -25 + Math.sin(time * 4) * 10, -20, -35);
            ctx.stroke();

            // Body
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Orange Patches
            ctx.fillStyle = '#ffa726';
            ctx.beginPath();
            ctx.ellipse(-4, -4, 10, 8, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(14, -12, 12, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#ffa726';
            // Left Ear
            ctx.beginPath();
            ctx.moveTo(6, -20);
            ctx.lineTo(11, -29 + Math.sin(time * 5) * 2);
            ctx.lineTo(15, -22);
            ctx.fill();
            // Right Ear
            ctx.beginPath();
            ctx.moveTo(14, -22);
            ctx.lineTo(19, -29 + Math.sin(time * 5 + 1) * 2);
            ctx.lineTo(22, -18);
            ctx.fill();

            // Eyes & Blush
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.arc(20, -13, 2, 0, Math.PI * 2); // Eye
            ctx.fill();

            ctx.fillStyle = '#ff80ab';
            ctx.beginPath();
            ctx.arc(18, -9, 3, 0, Math.PI * 2); // Blush
            ctx.fill();

            ctx.restore();

            // 6. Floating Light Particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.dx;
                p.y += p.dy;

                if (p.y < 0) p.y = canvas.height;
                if (p.x > canvas.width) p.x = 0;
            });

            requestAnimationFrame(drawAnimeBackground);
        }
        drawAnimeBackground();

        /* ----- Button Click Logic & Animations ----- */
        document.getElementById('open-btn').addEventListener('click', function(e) {
            // First Code Red Paper Confetti Explosion
            confetti({
                particleCount: 85,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#da251d', '#ff1744', '#ffc107', '#ff4081']
            });

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';

            let progress = 0;
            const progressBar = document.getElementById('p-bar');
            const interval = setInterval(() => {
                progress += 2;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showMainInterface, 300);
                }
            }, 30);
        });

        function showMainInterface() {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'block';

            // SVG Petals Shower
            setTimeout(createFlowerShower, 300);

            // Message Typewriter
            typeWriterMessage();
        }

        function createFlowerShower() {
            const count = 35;
            const petalColors = ['#ff80ab', '#ff4081', '#f48fb1', '#e91e63'];

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'svg-petal';

                    const size = Math.random() * 12 + 16;
                    const color = petalColors[Math.floor(Math.random() * petalColors.length)];

                    petal.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
                            <path d="M12 2C9 7 4 9 4 14c0 4.4 3.6 8 8 8s8-3.6 8-8c0-5-5-7-8-12z"/>
                        </svg>
                    `;

                    petal.style.left = (Math.random() * 100) + 'vw';
                    petal.style.top = '-10vh';
                    petal.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';

                    document.body.appendChild(petal);

                    setTimeout(() => petal.remove(), 4500);
                }, i * 90);
            }
        }

        function typeWriterMessage() {
            const text = "I have shut down my main accounts and cut out every unnecessary distraction.\n\nYour dedication, loyalty, and actions showed me what really matters. My energy and focus belong completely to our future now.\n\nNo distractions. Just us.";
            let index = 0;
            const target = document.getElementById('typed-text');

            function type() {
                if (index < text.length) {
                    target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                    index++;
                    setTimeout(type, 35);
                }
            }
            type();
        }
    </script>
</body>
</html>
