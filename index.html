<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Phyy's Letter</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #eef2f5; }
        #art-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #step-1 { text-align: center; z-index: 10; }
        .letter-btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; border: none; padding: 22px 50px; font-size: 22px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 15px 35px rgba(255, 71, 87, 0.35); transition: all 0.3s; }
        .letter-btn:hover { transform: translateY(-3px) scale(1.05); }
        #step-2 { display: none; flex-direction: column; align-items: center; gap: 16px; z-index: 10; }
        .heart-icon { font-size: 52px; color: #ff4757; animation: heartPulse 0.8s infinite alternate ease-in-out; }
        .progress-bar-container { width: 280px; height: 16px; background: rgba(255, 255, 255, 0.9); border-radius: 12px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff7f50); border-radius: 12px; transition: width 0.05s linear; }
        #step-3 { display: none; width: 90%; max-width: 600px; z-index: 10; }
        .clean-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); padding: 35px 30px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12); text-align: center; max-height: 85vh; display: flex; flex-direction: column; }
        .card-header { color: #2f3542; font-size: 26px; font-weight: 800; margin-bottom: 15px; letter-spacing: 1px; flex-shrink: 0; }
        .scroll-container { overflow-y: auto; padding-right: 10px; max-height: 50vh; text-align: left; }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #ff6b81; border-radius: 10px; }
        .message-content { font-size: 15px; line-height: 1.8; color: #57606f; white-space: pre-line; font-weight: 600; }
        .signature { margin-top: 25px; text-align: right; font-size: 20px; font-weight: 800; color: #ff4757; font-style: italic; letter-spacing: 1.5px; border-top: 1px solid #e0e0e0; padding-top: 10px; }
        @keyframes heartPulse { from { transform: scale(1); } to { transform: scale(1.18); } }
    </style>
</head>
<body>

    <canvas id="art-canvas"></canvas>

    <div id="step-1">
        <button class="letter-btn" id="open-btn">Open Phyy's Letter 💌</button>
    </div>

    <div id="step-2">
        <div class="heart-icon">♥</div>
        <div class="progress-bar-container"><div class="progress-bar" id="p-bar"></div></div>
        <div style="font-size: 15px; color: #2f3542; font-weight: 700; margin-top: 5px;">Opening your private letter...</div>
    </div>

    <div id="step-3">
        <div class="clean-card">
            <div class="card-header">Thê 🇻🇳 ❤️</div>
            <div class="scroll-container" id="scroll-box">
                <div class="message-content" id="typed-text"></div>
                <div class="signature">~ PHM.phyo ~</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('art-canvas');
            const ctx = canvas.getContext('2d');
            let grassBlades = [], flowers = [], clouds = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initEnvironment();
            }

            function initEnvironment() {
                grassBlades = [];
                const grassCount = Math.floor(canvas.width * 2.2);
                const startY = canvas.height * 0.62;
                const grassColors = ['#2ed573', '#26af5f', '#10ac84', '#7bed9f', '#05c46b'];

                for (let i = 0; i < grassCount; i++) {
                    grassBlades.push({
                        x: Math.random() * canvas.width,
                        y: startY + Math.random() * (canvas.height - startY),
                        height: Math.random() * 28 + 14,
                        curve: (Math.random() - 0.5) * 18,
                        color: grassColors[Math.floor(Math.random() * grassColors.length)],
                        windOffset: Math.random() * Math.PI * 2,
                        width: Math.random() * 1.5 + 1.2
                    });
                }

                flowers = [];
                const flowerCount = Math.floor(canvas.width * 0.18);
                for (let i = 0; i < flowerCount; i++) {
                    flowers.push({
                        x: Math.random() * canvas.width,
                        y: startY + 15 + Math.random() * (canvas.height - startY - 25),
                        size: Math.random() * 4 + 3,
                        type: Math.random() < 0.5 ? 'daisy' : 'pink',
                        swayOffset: Math.random() * Math.PI * 2
                    });
                }

                clouds = [
                    { x: canvas.width * 0.1, y: canvas.height * 0.15, scale: 1.0, speed: 0.3 },
                    { x: canvas.width * 0.4, y: canvas.height * 0.10, scale: 1.3, speed: 0.4 },
                    { x: canvas.width * 0.75, y: canvas.height * 0.18, scale: 0.9, speed: 0.25 },
                    { x: canvas.width * -0.2, y: canvas.height * 0.22, scale: 1.1, speed: 0.35 }
                ];
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const butterfly = {
                x: window.innerWidth * 0.5,
                y: window.innerHeight * 0.65,
                targetX: window.innerWidth * 0.5,
                targetY: window.innerHeight * 0.65,
                angle: 0
            };

            const catBlack = { x: window.innerWidth * 0.5 - 90, y: window.innerHeight * 0.78, color: '#1e272e', eyeColor: '#ffdd59', pawY: 0 };
            const catGolden = { x: window.innerWidth * 0.5 + 90, y: window.innerHeight * 0.78, color: '#d35400', stripeColor: '#a04000', eyeColor: '#2ecc71', pawY: 0 };

            function drawCloud(cx, cy, scale) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                ctx.beginPath();
                ctx.arc(cx, cy, 35 * scale, 0, Math.PI * 2);
                ctx.arc(cx - 25 * scale, cy + 10 * scale, 25 * scale, 0, Math.PI * 2);
                ctx.arc(cx + 30 * scale, cy + 8 * scale, 28 * scale, 0, Math.PI * 2);
                ctx.arc(cx + 10 * scale, cy - 15 * scale, 26 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawDetailedButterfly(b, time) {
                ctx.save();
                ctx.translate(b.x, b.y);
                const wingSway = Math.sin(time * 18) * 0.8 + 0.2;

                ctx.shadowColor = 'rgba(255, 107, 129, 0.9)';
                ctx.shadowBlur = 12;

                // Wing Left
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.ellipse(-9 * wingSway, -5, 11 * wingSway, 8, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.ellipse(-7 * wingSway, -4, 6 * wingSway, 4, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Wing Right
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.ellipse(9 * wingSway, -5, 11 * wingSway, 8, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.ellipse(7 * wingSway, -4, 6 * wingSway, 4, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#2f3542';
                ctx.beginPath();
                ctx.ellipse(0, 0, 2.5, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Antennae
                ctx.strokeStyle = '#2f3542';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-1, -7); ctx.lineTo(-5, -14);
                ctx.moveTo(1, -7); ctx.lineTo(5, -14);
                ctx.stroke();

                ctx.restore();
            }

            // Facing Center Black Cat (Reaching Paw & Eye Tracking)
            function drawFacingBlackCat(c, time, targetX, targetY) {
                ctx.save();
                ctx.translate(c.x, c.y + Math.sin(time * 3) * 2);

                // Tail
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-12, -2);
                ctx.quadraticCurveTo(-28, -20 + Math.sin(time * 4) * 12, -20, -36);
                ctx.stroke();

                // Body
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Reaching Front Paw (Playing with Butterfly)
                const pawReach = Math.sin(time * 6) * 12;
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(10, 2);
                ctx.quadraticCurveTo(22, -10 + pawReach, 28, -18 + pawReach);
                ctx.stroke();

                // Head
                ctx.beginPath();
                ctx.arc(12, -15, 13, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(4, -22); ctx.lineTo(8, -32); ctx.lineTo(14, -24);
                ctx.moveTo(13, -24); ctx.lineTo(18, -32); ctx.lineTo(22, -20);
                ctx.fill();

                // Dynamic Eyes Tracking Butterfly
                const dx = targetX - (c.x + 16);
                const dy = targetY - (c.y - 17);
                const angle = Math.atan2(dy, dx);
                const eyeOffsetX = Math.cos(angle) * 2;
                const eyeOffsetY = Math.sin(angle) * 2;

                ctx.fillStyle = c.eyeColor;
                ctx.beginPath();
                ctx.ellipse(16, -17, 4, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(16 + eyeOffsetX, -17 + eyeOffsetY, 1.5, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Whiskers
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(20, -13); ctx.lineTo(30, -15);
                ctx.moveTo(20, -11); ctx.lineTo(29, -9);
                ctx.stroke();

                ctx.restore();
            }

            // Facing Center Golden Brown Cat (Reaching Paw & Eye Tracking)
            function drawFacingGoldenCat(c, time, targetX, targetY) {
                ctx.save();
                ctx.translate(c.x, c.y + Math.cos(time * 3) * 2);

                // Tail
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(12, -2);
                ctx.quadraticCurveTo(28, -18 + Math.cos(time * 4) * 12, 20, -34);
                ctx.stroke();

                // Body
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 21, 16, 0, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.fillStyle = c.stripeColor;
                ctx.beginPath();
                ctx.ellipse(4, -4, 5, 10, -0.3, 0, Math.PI * 2);
                ctx.ellipse(-4, -2, 4, 9, -0.1, 0, Math.PI * 2);
                ctx.fill();

                // Reaching Front Paw (Playing with Butterfly)
                const pawReach = Math.cos(time * 6) * 12;
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-10, 2);
                ctx.quadraticCurveTo(-22, -10 + pawReach, -28, -18 + pawReach);
                ctx.stroke();

                // Head
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(-12, -15, 13, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.beginPath();
                ctx.moveTo(-5, -22); ctx.lineTo(-9, -32); ctx.lineTo(-15, -24);
                ctx.moveTo(-14, -24); ctx.lineTo(-19, -32); ctx.lineTo(-23, -20);
                ctx.fill();

                // Dynamic Eyes Tracking Butterfly
                const dx = targetX - (c.x - 16);
                const dy = targetY - (c.y - 17);
                const angle = Math.atan2(dy, dx);
                const eyeOffsetX = Math.cos(angle) * 2;
                const eyeOffsetY = Math.sin(angle) * 2;

                ctx.fillStyle = c.eyeColor;
                ctx.beginPath();
                ctx.ellipse(-16, -17, 4, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(-16 + eyeOffsetX, -17 + eyeOffsetY, 1.5, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Whiskers
                ctx.strokeStyle = '#57606f';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(-20, -12); ctx.lineTo(-29, -14);
                ctx.moveTo(-20, -10); ctx.lineTo(-28, -8);
                ctx.stroke();

                ctx.restore();
            }

            function renderMasterpiece() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.002;

                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.65);
                skyGrad.addColorStop(0, '#0984e3');
                skyGrad.addColorStop(0.4, '#74b9ff');
                skyGrad.addColorStop(0.8, '#81ecec');
                skyGrad.addColorStop(1, '#eccc68');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Sun
                const sunX = canvas.width * 0.78, sunY = canvas.height * 0.16;
                const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 200);
                sunGlow.addColorStop(0, 'rgba(255, 255, 230, 0.95)');
                sunGlow.addColorStop(0.3, 'rgba(255, 234, 167, 0.5)');
                sunGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = sunGlow;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Moving Clouds
                clouds.forEach(c => {
                    c.x += c.speed;
                    if (c.x - 120 > canvas.width) c.x = -120;
                    drawCloud(c.x, c.y, c.scale);
                });

                // Ground
                const groundY = canvas.height * 0.62;
                const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
                groundGrad.addColorStop(0, '#2ed573');
                groundGrad.addColorStop(0.5, '#26af5f');
                groundGrad.addColorStop(1, '#10ac84');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                // Grass Swaying
                for (let i = 0; i < grassBlades.length; i++) {
                    const b = grassBlades[i];
                    const sway = Math.sin(time * 2.5 + b.windOffset) * 6;
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = b.width;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.quadraticCurveTo(b.x + b.curve, b.y - b.height * 0.5, b.x + b.curve + sway, b.y - b.height);
                    ctx.stroke();
                }

                // Swaying Flowers
                flowers.forEach(f => {
                    const flowerSway = Math.sin(time * 2 + f.swayOffset) * 4;
                    const fx = f.x + flowerSway;
                    ctx.fillStyle = f.type === 'daisy' ? '#ffffff' : '#ff7675';
                    ctx.beginPath(); ctx.arc(fx, f.y, f.size, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fbc531';
                    ctx.beginPath(); ctx.arc(fx, f.y, f.size * 0.4, 0, Math.PI * 2); ctx.fill();
                });

                // Butterfly Playful Movement between Cats
                butterfly.angle += 0.05;
                const centerX = canvas.width * 0.5;
                butterfly.targetX = centerX + Math.sin(butterfly.angle * 1.5) * 80;
                butterfly.targetY = canvas.height * 0.66 + Math.cos(butterfly.angle * 3) * 25;

                butterfly.x += (butterfly.targetX - butterfly.x) * 0.06;
                butterfly.y += (butterfly.targetY - butterfly.y) * 0.06;

                drawDetailedButterfly(butterfly, time);

                // Cats Positioning Facing Center
                catBlack.x = centerX - 85;
                catGolden.x = centerX + 85;

                drawFacingBlackCat(catBlack, time, butterfly.x, butterfly.y);
                drawFacingGoldenCat(catGolden, time, butterfly.x, butterfly.y);

                requestAnimationFrame(renderMasterpiece);
            }

            renderMasterpiece();

            document.getElementById('open-btn').addEventListener('click', () => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 100, origin: { y: 0.6 } });
                }

                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'flex';

                let progress = 0;
                const progressBar = document.getElementById('p-bar');
                const interval = setInterval(() => {
                    progress += 4;
                    progressBar.style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                        document.getElementById('step-2').style.display = 'none';
                        document.getElementById('step-3').style.display = 'block';
                        typeWriterMessage();
                    }
                }, 30);
            });

            function typeWriterMessage() {
                const text = "Thê, you are a truly talented and capable girl. I sincerely respect, admire, and love you.\n\nYou are immensely valuable to me—one of a kind, irreplaceable. You might think I am exaggerating, but having met many people, I can confidently say no one comes close to your qualities.\n\nWhen I was surrounded by betrayal and completely broken, you became my sole emotional supporter. Your hard work, dedication, and endurance inspired me and gave me strength.\n\nThat is why I will try my best to take even better care of you. To stay away from other girls, I have shut down my main account and switched to a private account shared only with you and my closest friends. My attention belongs solely to you.\n\nSo, let us work hard and build our future together.";
                let index = 0;
                const target = document.getElementById('typed-text');
                const scrollBox = document.getElementById('scroll-box');
                target.innerHTML = "";

                function type() {
                    if (index < text.length) {
                        target.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
                        index++;
                        scrollBox.scrollTop = scrollBox.scrollHeight;
                        setTimeout(type, 30);
                    }
                }
                type();
            }
        });
    </script>
</body>
</html>
